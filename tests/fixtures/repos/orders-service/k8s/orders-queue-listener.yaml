apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-queue-listener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-queue-listener
  template:
    metadata:
      labels:
        app: orders-queue-listener
    spec:
      containers:
        - name: orders-queue-listener
          image: ordersacr.azurecr.io/orders/orders-queue-listener
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/healthy"]

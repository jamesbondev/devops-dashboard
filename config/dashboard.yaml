# DevOps Dashboard configuration. Reloaded from the Settings page ("Reload config").
# Validation errors are shown on the Settings/Setup page; the app keeps the last valid config.

azureDevOps:
  # "mock" = synthetic data, no network. Switch to "live" once ADO_PAT is set in .env.
  mode: mock
  organization: contoso          # https://dev.azure.com/<organization>
  project: Platform              # the ADO project that holds your team's repos
  apiVersion: "7.1"

time:
  timeZone: Europe/London        # IANA id; used for working hours and the daily job
  workdayStart: "09:00"
  workdayEnd: "17:30"
  workDays: [Monday, Tuesday, Wednesday, Thursday, Friday]

# Environments are matched against timeline STAGE names/identifiers (regex, case-insensitive).
# Our release template names deploy stages "test{env} deploy" (team envs: lemur, skele, narwhal, duckzilla,
# accounts, drogon, fox2, oce, pthr …) and "{staging|sim|prod}{green|eu} deploy" (green = UK).
# sim and prod are both Production tier. Drift is only compared within a region (a release may go to one region).
environments:
  - { name: team,          tier: Team,       order: 0,                 stagePatterns: ['^test[a-z0-9]+[ _-]?(deploy|apply)$'] }
  - { name: staging-green, tier: Staging,    order: 1, region: green,  stagePatterns: ['^staging[ _-]?green[ _-]?(deploy|apply)$'] }
  - { name: staging-eu,    tier: Staging,    order: 2, region: eu,     stagePatterns: ['^staging[ _-]?eu[ _-]?(deploy|apply)$'] }
  - { name: sim-green,     tier: Production, order: 3, region: green,  stagePatterns: ['^sim[ _-]?green[ _-]?(deploy|apply)$'] }
  - { name: sim-eu,        tier: Production, order: 4, region: eu,     stagePatterns: ['^sim[ _-]?eu[ _-]?(deploy|apply)$'] }
  - { name: prod-green,    tier: Production, order: 5, region: green,  stagePatterns: ['^prod[ _-]?green[ _-]?(deploy|apply)$'] }
  - { name: prod-eu,       tier: Production, order: 6, region: eu,     stagePatterns: ['^prod[ _-]?eu[ _-]?(deploy|apply)$'] }
  # Optional: add adoId (from .../_environments/<id>) to read an environment's Approvals & checks for the Gates page.
defaultEnvironmentTier: Team

# CI and release are separate YAML pipelines. Release pipelines are excluded from build stability; they're detected by
# name, or automatically (never run for PRs + every run has deploy stages). Gate stages hold a release before deploying.
pipelines:
  releaseNamePatterns: ['release']
  gateStagePatterns: ['approval[ _-]?gate']   # "Approval Gate 2" — time here counts as approval wait
  gateBlockedMinutes: 10                       # show "release waiting at gate" on Now after this long
  # The environment the Approval Gate 2 deployment job targets (its checks hold the release). Name + id from
  # Pipelines → Environments → <env> (URL …/_environments/<id>). Its Approvals & checks show on the Gates page.
  gateEnvironments:
    - { name: "Automated Approval Gate 2", adoId: 186 }
  # Gate checks that usually need you (timeline check names). A pending one shows on Now as "review needed" (YOU).
  manualReviewCheckPatterns: ['release minder']

# The shared YAML templates repo (owned by another team). `project` is the ADO project that holds it
# (can differ from azureDevOps.project). aliasPatterns match the `resources.repositories` alias in your pipelines.
templates:
  project: cbi                   # resources.repositories name: cbi/cbi-yaml-templates
  repository: cbi-yaml-templates
  aliasPatterns: ["^templates?$", "cbi-yaml-templates"]
  compliantBranches: [main]
  experimentalBranches: [next]
  staleInfoDays: 14

# Identities excluded from PR metrics (substring match on display name, or exact id).
botIdentities: ["Project Collection Build Service", "Build Service", "clearcoder", "product-health", "dependabot", "renovate", "Azure Pipelines"]

sync:
  hotSeconds: 60                 # active PRs, running builds, pending approvals
  warmMinutes: 15                # history
  dailyHour: 2                   # local hour; runs on startup if overdue
  backfillPrDays: 180
  backfillBuildDays: 90           # builds older than retention are gone anyway
  overlapMinutes: 60

results:
  succeededWithIssuesIsFailure: true   # "if a step failed, the pipeline failed"

metrics:
  windowDays: 30
  minRuns: 10
  minPrs: 5
  percentileMinSample: 20        # median below this sample size, p85 at or above
  stuckPrIdleWorkingHours: 8
  stalePrWorkingDays: 3
  dormantDays: 30

# Tier rules. Tiers are cumulative gates; Insufficient data never passes.
# Calibrate thresholds after the first full sync (Health page shows the distribution).
rules:
  - { id: PIPE-001, tier: Bronze }
  - { id: POL-001,  tier: Bronze }
  - { id: POL-002,  tier: Bronze }
  - { id: TPL-001,  tier: Bronze }
  - { id: DOC-001,  tier: Bronze }
  - { id: NET-001,  tier: Bronze }
  - { id: BLD-001,  tier: Silver, threshold: 0.90 }   # main success rate
  - { id: BLD-002,  tier: Silver, threshold: 8 }      # longest red interval, working hours
  - { id: FLK-001,  tier: Silver, threshold: 0.05 }   # flaky run rate
  - { id: PR-001,   tier: Silver, threshold: 16 }     # time to first review, working hours
  - { id: TPL-002,  tier: Silver }
  - { id: BLD-003,  tier: Gold,   threshold: 0.95 }
  - { id: PR-002,   tier: Gold,   threshold: 5 }      # oldest active PR, working days
  - { id: DEP-001,  tier: Gold,   threshold: 30, repoTypes: [Service] }
  - { id: TST-001,  tier: Gold,   repoTypes: [Service, Library, Infra] }   # n/a for E2E / Load test repos
  - { id: AUD-001,  tier: Gold }

repos:
  # Test-only repos (E2E / Load): no "deployed to Production" or "test projects" tier rules, failing runs show as a
  # low-priority "tests failing" item on Now (not "main red"), and the auditor is told what kind of repo it is.
  # Order: types below > type chosen on the repo page > name patterns > Service.
  e2ePatterns: ['^end2end[_-]', '(^|[_-])e2e([_-]|$)']
  loadPatterns: ['(^|[_-])load([_-]|$)']
  types: []
  #  - { name: some-odd-test-repo, type: E2E }     # Service | Library | Infra | E2E | Load

components:
  # Hide or add components the scanners get wrong.
  overrides: []
  #  - { repo: orders, name: orders-api, kind: AksService }
  #  - { repo: orders, name: legacy-thing, hidden: true }
  # Map deployment stages/jobs to components when job names are generic.
  deployRules: []
  #  - { repo: "^orders$", stagePattern: "prod", jobPattern: "dacpac", component: Orders.Database }
  # Deploy-stage jobs that deploy components. Other jobs (pre_apply, terraform_*, mssql_managed_identity_deploy)
  # are infrastructure and don't count as a component deployment.
  aksJobPatterns: ['skaffold']                 # skaffold_deploy → every AKS component in the repo
  databaseJobPatterns: ['dacpac']              # dacpac_apply → the repo's .sqlproj database(s)

audit:
  enabled: true
  auditorUrl: http://auditor:8081
  model: claude-opus-5.5         # preferred; falls back to the strongest available model
  reasoningEffort: high
  timeoutMinutes: 20
  votes: 1                       # 3 = majority vote over judgement checks
  minHoursBetweenAudits: 24
  rubricPath: audit/rubric
  clonesPath: /clones
  goldenRepos: []                # hand-labelled calibration repos

nowView:
  panels: [attention, matrix, running, shipped, sinceLastLooked]
  shippedHours: 24
  recentFailureHours: 24

notifications:
  enabled: true
  approvalWaitingForMe: true
  productionDeployFailed: true
  mainRedHours: 1
